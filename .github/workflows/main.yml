name: Build NonsPlayer Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        shell: pwsh
        run: npm install --global pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install project dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Android SDK and NDK
        shell: pwsh
        run: python scripts/bootstrap-android.py --accept-licenses

      - name: Build and verify APK
        shell: pwsh
        run: pnpm --dir app build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NonsPlayer-Android-ARM64
          path: |
            .local/android/Nons-*-android-arm64-debug.apk
            .local/android/Nons-*-android-arm64-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
